  spring:
    application:
      name: config-server
    cloud:
      config:
        server:
          git:
            uri: https://github.com/MaryamElHaddoumi/ticketflow-config.git
            default-label: main
            clone-on-start: true

  server:
    port: 8888

  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka/
      register-with-eureka: true
      fetch-registry: true